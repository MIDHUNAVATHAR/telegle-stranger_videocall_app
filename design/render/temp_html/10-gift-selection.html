
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  :root {
    --bg-dark: #080B12;
    --bg-surface: #101624;
    --bg-elevated: #161F33;
    --bg-input: #141B2D;
    --border-subtle: #202B3F;
    --border-strong: #2D3D5A;
    --text-main: #F8FAFC;
    --text-muted: #94A3B8;
    --text-dim: #64748B;
    /* New Vibrant Sunset Flame / Tangerine Accent (Eliminates adult webcam pink) */
    --accent: #FF5A1F;
    --accent-hover: #E84D15;
    --accent-subtle: rgba(255, 90, 31, 0.12);
    --gold: #F59E0B;
    --gold-subtle: rgba(245, 158, 11, 0.15);
    --emerald: #10B981;
    --emerald-subtle: rgba(16, 185, 129, 0.12);
    --danger: #EF4444;
  }
  body {
    background: var(--bg-dark);
    color: var(--text-main);
    width: 412px;
    height: 892px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  /* Status Bar */
  .status-bar {
    height: 48px;
    padding: 12px 24px 0 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-main);
    z-index: 100;
  }
  .status-bar-icons {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dynamic-island {
    width: 108px;
    height: 28px;
    background: #000;
    border-radius: 20px;
    position: absolute;
    left: 50%;
    top: 10px;
    transform: translateX(-50%);
  }
  /* Bottom Nav */
  .bottom-nav {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 82px;
    background: #0A0F1A;
    border-top: 1px solid var(--border-subtle);
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding-bottom: 14px;
    z-index: 90;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: color 0.15s ease;
  }
  .nav-item.active {
    color: var(--accent);
    font-weight: 700;
  }
  .nav-item svg {
    width: 22px;
    height: 22px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 132px;
    height: 4px;
    background: #475569;
    border-radius: 2px;
  }
  /* Brand Badge */
  .brand-logo-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo-icon-box {
    width: 34px;
    height: 34px;
    background: linear-gradient(135deg, #FF5A1F, #FF7E40);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 800;
    font-size: 18px;
    box-shadow: 0 4px 14px rgba(255, 90, 31, 0.4);
  }
  .brand-text {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--text-main);
  }
  .brand-text span {
    color: var(--accent);
  }
  .coin-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    color: var(--gold);
  }
  .coin-pill .plus-btn {
    width: 18px;
    height: 18px;
    background: var(--gold);
    color: #000;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 900;
    line-height: 1;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 14px;
    height: 52px;
    font-size: 16px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(255, 90, 31, 0.35);
    text-decoration: none;
  }
  .btn-secondary {
    background: var(--bg-elevated);
    color: var(--text-main);
    border: 1px solid var(--border-subtle);
    border-radius: 14px;
    height: 50px;
    font-size: 15px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
  }
  /* Safety & Respect Community Badges (Replaces 18+ explicit badge) */
  .safety-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    color: #34D399;
    background: rgba(16, 185, 129, 0.1);
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid rgba(16, 185, 129, 0.25);
  }
  .rule-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    background: rgba(255, 255, 255, 0.06);
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

    .gift-screen {
      position: relative;
      width: 412px;
      height: 892px;
      background: #000;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .bg-video-blur {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(12px) brightness(0.4);
      transform: scale(1.05);
    }
    /* Bottom Sheet */
    .gift-drawer {
      position: relative;
      z-index: 10;
      width: 100%;
      background: #0F1420;
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      border-top: 1px solid var(--border-strong);
      padding: 12px 20px 24px 20px;
      box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.7);
    }
    .drawer-handle {
      width: 40px;
      height: 4px;
      background: #475569;
      border-radius: 2px;
      margin: 0 auto 14px auto;
    }
    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .drawer-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
    }
    /* Gift Grid */
    .gifts-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }
    .gift-item-card {
      background: var(--bg-surface);
      border: 1.5px solid var(--border-subtle);
      border-radius: 16px;
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      position: relative;
    }
    .gift-item-card.selected {
      border-color: var(--gold);
      background: rgba(245, 158, 11, 0.12);
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.25);
    }
    .gift-item-card.locked {
      opacity: 0.5;
    }
    .gift-emoji {
      font-size: 32px;
      margin-bottom: 4px;
    }
    .gift-name {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }
    .gift-price-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 12px;
      font-weight: 800;
      color: var(--gold);
    }
    .locked-tag {
      position: absolute;
      top: 6px;
      right: 6px;
      font-size: 10px;
    }
    .disclaimer-text {
      text-align: center;
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 10px;
    }
  </style>
</head>
