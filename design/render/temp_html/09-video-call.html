
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  :root {
    --bg-dark: #080B12;
    --bg-surface: #101624;
    --bg-elevated: #161F33;
    --bg-input: #141B2D;
    --border-subtle: #202B3F;
    --border-strong: #2D3D5A;
    --text-main: #F8FAFC;
    --text-muted: #94A3B8;
    --text-dim: #64748B;
    /* New Vibrant Sunset Flame / Tangerine Accent (Eliminates adult webcam pink) */
    --accent: #FF5A1F;
    --accent-hover: #E84D15;
    --accent-subtle: rgba(255, 90, 31, 0.12);
    --gold: #F59E0B;
    --gold-subtle: rgba(245, 158, 11, 0.15);
    --emerald: #10B981;
    --emerald-subtle: rgba(16, 185, 129, 0.12);
    --danger: #EF4444;
  }
  body {
    background: var(--bg-dark);
    color: var(--text-main);
    width: 412px;
    height: 892px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  /* Status Bar */
  .status-bar {
    height: 48px;
    padding: 12px 24px 0 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-main);
    z-index: 100;
  }
  .status-bar-icons {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dynamic-island {
    width: 108px;
    height: 28px;
    background: #000;
    border-radius: 20px;
    position: absolute;
    left: 50%;
    top: 10px;
    transform: translateX(-50%);
  }
  /* Bottom Nav */
  .bottom-nav {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 82px;
    background: #0A0F1A;
    border-top: 1px solid var(--border-subtle);
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding-bottom: 14px;
    z-index: 90;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: color 0.15s ease;
  }
  .nav-item.active {
    color: var(--accent);
    font-weight: 700;
  }
  .nav-item svg {
    width: 22px;
    height: 22px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 132px;
    height: 4px;
    background: #475569;
    border-radius: 2px;
  }
  /* Brand Badge */
  .brand-logo-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo-icon-box {
    width: 34px;
    height: 34px;
    background: linear-gradient(135deg, #FF5A1F, #FF7E40);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 800;
    font-size: 18px;
    box-shadow: 0 4px 14px rgba(255, 90, 31, 0.4);
  }
  .brand-text {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--text-main);
  }
  .brand-text span {
    color: var(--accent);
  }
  .coin-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    color: var(--gold);
  }
  .coin-pill .plus-btn {
    width: 18px;
    height: 18px;
    background: var(--gold);
    color: #000;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 900;
    line-height: 1;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 14px;
    height: 52px;
    font-size: 16px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(255, 90, 31, 0.35);
    text-decoration: none;
  }
  .btn-secondary {
    background: var(--bg-elevated);
    color: var(--text-main);
    border: 1px solid var(--border-subtle);
    border-radius: 14px;
    height: 50px;
    font-size: 15px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
  }
  /* Safety & Respect Community Badges (Replaces 18+ explicit badge) */
  .safety-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    color: #34D399;
    background: rgba(16, 185, 129, 0.1);
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid rgba(16, 185, 129, 0.25);
  }
  .rule-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    background: rgba(255, 255, 255, 0.06);
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

    .video-call-screen {
      position: relative;
      width: 412px;
      height: 892px;
      background: #000;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    /* Fullscreen Matched Video Feed */
    .main-video-feed {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    .video-scrim-top {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 140px;
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, transparent 100%);
      z-index: 2;
    }
    .video-scrim-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 250px;
      background: linear-gradient(0deg, rgba(0,0,0,0.94) 0%, rgba(0,0,0,0.5) 60%, transparent 100%);
      z-index: 2;
    }
    /* Top Call Header */
    .call-top-bar {
      position: relative;
      z-index: 10;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .matched-info-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(12px);
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .matched-user-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }
    .call-timer {
      font-size: 12px;
      color: #34D399;
      font-weight: 600;
    }
    .btn-report {
      background: rgba(239, 68, 68, 0.25);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #F87171;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }
    /* Picture-in-Picture Self Preview */
    /* Carefully placed above bottom control bar, no overlap! */
    .pip-self-view {
      position: absolute;
      right: 18px;
      bottom: 122px;
      width: 100px;
      height: 140px;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      z-index: 15;
    }
    .pip-self-view img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .pip-label {
      position: absolute;
      bottom: 4px;
      left: 6px;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      background: rgba(0, 0, 0, 0.6);
      padding: 2px 6px;
      border-radius: 4px;
    }
    /* Live safety reminder pill */
    .safety-reminder-bar {
      margin: 6px auto 0 auto;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      color: #E2E8F0;
      width: fit-content;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    /* Ephemeral in-call chat bubble */
    .in-call-chat-bubble {
      position: absolute;
      left: 18px;
      bottom: 122px;
      max-width: 250px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 10px 14px;
      color: #fff;
      font-size: 13px;
      line-height: 1.35;
      z-index: 10;
    }
    .chat-bubble-author {
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 2px;
      font-size: 11px;
    }
    /* Bottom Controls */
    .bottom-call-controls {
      position: relative;
      z-index: 20;
      padding: 0 20px 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .in-call-input-row {
      display: flex;
      gap: 8px;
    }
    .in-call-input {
      flex: 1;
      height: 44px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      padding: 0 16px;
      font-size: 14px;
      color: #fff;
      display: flex;
      align-items: center;
    }
    .btn-send-chat {
      width: 44px;
      height: 44px;
      background: var(--accent);
      border-radius: 50%;
      border: none;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .call-action-buttons-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .action-circle-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .btn-gift-trigger {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 50px;
      background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
      color: #000;
      font-size: 14px;
      font-weight: 800;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(245, 158, 11, 0.4);
    }
    .btn-leave-call {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--danger);
      color: #fff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(239, 68, 68, 0.5);
    }
  </style>
</head>
