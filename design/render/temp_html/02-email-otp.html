
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  :root {
    --bg-dark: #080B12;
    --bg-surface: #101624;
    --bg-elevated: #161F33;
    --bg-input: #141B2D;
    --border-subtle: #202B3F;
    --border-strong: #2D3D5A;
    --text-main: #F8FAFC;
    --text-muted: #94A3B8;
    --text-dim: #64748B;
    /* New Vibrant Sunset Flame / Tangerine Accent (Eliminates adult webcam pink) */
    --accent: #FF5A1F;
    --accent-hover: #E84D15;
    --accent-subtle: rgba(255, 90, 31, 0.12);
    --gold: #F59E0B;
    --gold-subtle: rgba(245, 158, 11, 0.15);
    --emerald: #10B981;
    --emerald-subtle: rgba(16, 185, 129, 0.12);
    --danger: #EF4444;
  }
  body {
    background: var(--bg-dark);
    color: var(--text-main);
    width: 412px;
    height: 892px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  /* Status Bar */
  .status-bar {
    height: 48px;
    padding: 12px 24px 0 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-main);
    z-index: 100;
  }
  .status-bar-icons {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dynamic-island {
    width: 108px;
    height: 28px;
    background: #000;
    border-radius: 20px;
    position: absolute;
    left: 50%;
    top: 10px;
    transform: translateX(-50%);
  }
  /* Bottom Nav */
  .bottom-nav {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 82px;
    background: #0A0F1A;
    border-top: 1px solid var(--border-subtle);
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding-bottom: 14px;
    z-index: 90;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: color 0.15s ease;
  }
  .nav-item.active {
    color: var(--accent);
    font-weight: 700;
  }
  .nav-item svg {
    width: 22px;
    height: 22px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 132px;
    height: 4px;
    background: #475569;
    border-radius: 2px;
  }
  /* Brand Badge */
  .brand-logo-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo-icon-box {
    width: 34px;
    height: 34px;
    background: linear-gradient(135deg, #FF5A1F, #FF7E40);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 800;
    font-size: 18px;
    box-shadow: 0 4px 14px rgba(255, 90, 31, 0.4);
  }
  .brand-text {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--text-main);
  }
  .brand-text span {
    color: var(--accent);
  }
  .coin-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    color: var(--gold);
  }
  .coin-pill .plus-btn {
    width: 18px;
    height: 18px;
    background: var(--gold);
    color: #000;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 900;
    line-height: 1;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 14px;
    height: 52px;
    font-size: 16px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(255, 90, 31, 0.35);
    text-decoration: none;
  }
  .btn-secondary {
    background: var(--bg-elevated);
    color: var(--text-main);
    border: 1px solid var(--border-subtle);
    border-radius: 14px;
    height: 50px;
    font-size: 15px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
  }
  /* Safety & Respect Community Badges (Replaces 18+ explicit badge) */
  .safety-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    color: #34D399;
    background: rgba(16, 185, 129, 0.1);
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid rgba(16, 185, 129, 0.25);
  }
  .rule-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    background: rgba(255, 255, 255, 0.06);
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }

    .otp-container {
      flex: 1;
      padding: 24px 24px 32px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .top-action-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .back-btn {
      width: 40px;
      height: 40px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      cursor: pointer;
    }
    .otp-header {
      margin-bottom: 32px;
    }
    .otp-badge {
      width: 56px;
      height: 56px;
      background: var(--accent-subtle);
      border: 1px solid rgba(255, 90, 31, 0.3);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: var(--accent);
      margin-bottom: 20px;
    }
    .otp-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .otp-subtitle {
      font-size: 15px;
      line-height: 1.45;
      color: var(--text-muted);
    }
    .otp-email-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      font-weight: 600;
      color: var(--text-main);
    }
    .edit-email-btn {
      color: var(--accent);
      font-size: 13px;
      text-decoration: underline;
      cursor: pointer;
    }
    .otp-boxes {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin: 32px 0 24px 0;
    }
    .otp-digit {
      flex: 1;
      height: 58px;
      background: var(--bg-input);
      border: 1.5px solid var(--border-subtle);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      color: var(--text-main);
    }
    .otp-digit.filled {
      border-color: #334155;
      background: var(--bg-surface);
    }
    .otp-digit.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255, 90, 31, 0.2);
    }
    .cursor-bar {
      width: 2px;
      height: 24px;
      background: var(--accent);
    }
    .resend-box {
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }
    .resend-box strong {
      color: var(--text-main);
    }
    .security-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 16px;
    }
  </style>
</head>
<body>
  
  <div class="status-bar">
    <span>9:41</span>
    <div class="dynamic-island"></div>
    <div class="status-bar-icons">
      <svg width="18" height="14" viewBox="0 0 18 14" fill="currentColor">
        <rect x="0" y="8" width="3" height="6" rx="1"/>
        <rect x="5" y="5" width="3" height="9" rx="1"/>
        <rect x="10" y="2" width="3" height="12" rx="1"/>
        <rect x="15" y="0" width="3" height="14" rx="1"/>
      </svg>
      <svg width="16" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
      <svg width="22" height="12" viewBox="0 0 24 12" fill="currentColor">
        <rect x="0" y="0" width="20" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>
        <rect x="2" y="2" width="13" height="8" rx="1.5"/>
        <rect x="22" y="4" width="2" height="4" rx="1"/>
      </svg>
    </div>
  </div>

  <div class="otp-container">
    <div>
      <div class="top-action-bar">
        <div class="back-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </div>
        <span style="font-size: 15px; font-weight: 600; color: var(--text-muted);">Account Verification</span>
      </div>

      <div class="otp-header">
        <div class="otp-badge">✉️</div>
        <h1 class="otp-title">Verify your email</h1>
        <p class="otp-subtitle">We sent a 6-digit confirmation code to</p>
        <div class="otp-email-row">
          <span>alex.morgan@gmail.com</span>
          <span class="edit-email-btn">Edit email</span>
        </div>
      </div>

      <div class="otp-boxes">
        <div class="otp-digit filled">4</div>
        <div class="otp-digit filled">9</div>
        <div class="otp-digit filled">2</div>
        <div class="otp-digit active"><div class="cursor-bar"></div></div>
        <div class="otp-digit"></div>
        <div class="otp-digit"></div>
      </div>

      <div class="resend-box">
        Didn't receive it? Resend in <strong>0:42</strong>
      </div>
    </div>

    <div>
      <button class="btn-primary" style="width: 100%;">
        <span>Verify & Continue</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </button>

      <div class="security-note">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        <span>Passwordless authentication · Safe & verified access</span>
      </div>
    </div>
  </div>
  <div class="home-indicator"></div>
</body>
</html>
