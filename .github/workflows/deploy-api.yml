name: Deploy Backend API

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'turbo.json'
      - '.github/workflows/deploy-api.yml'

jobs:
  validate-and-test:
    name: Validate & Test API
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint & Typecheck
        run: |
          pnpm --filter api lint
          pnpm --filter api typecheck

      - name: Run API Tests
        run: pnpm --filter api test
        env:
          NODE_ENV: test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test_jwt_secret_key_32_characters_long_min
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_key_32_characters_long_min

      - name: Build API
        run: pnpm --filter api build

  deploy-to-server:
    name: Deploy API to Server via Docker
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e

            echo "=== Step 1: Checking Docker & Docker Compose installation ==="
            if ! command -v docker &> /dev/null; then
              echo "Docker not found. Installing Docker engine..."
              curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
              sudo sh /tmp/get-docker.sh
              sudo usermod -aG docker $USER || true
              sudo systemctl enable --now docker
              rm -f /tmp/get-docker.sh
              echo "Docker installed successfully: $(docker --version)"
            else
              echo "Docker is already installed: $(docker --version)"
            fi

            if ! docker compose version &> /dev/null; then
              echo "Installing Docker Compose plugin..."
              sudo apt-get update && sudo apt-get install -y docker-compose-plugin
              echo "Docker Compose installed: $(docker compose version)"
            else
              echo "Docker Compose is ready: $(docker compose version)"
            fi

            DEPLOY_PATH="${{ secrets.DEPLOY_DIR || '~/stranger_connect' }}"
            echo "=== Step 2: Syncing Repository at $DEPLOY_PATH ==="
            if [ ! -d "$DEPLOY_PATH" ]; then
              echo "Cloning repository..."
              git clone https://github.com/${{ github.repository }}.git "$DEPLOY_PATH"
              cd "$DEPLOY_PATH"
            else
              cd "$DEPLOY_PATH"
              echo "Pulling latest changes from branch..."
              git fetch origin main || git fetch origin master
              git reset --hard origin/main || git reset --hard origin/master
            fi

            echo "=== Step 3: Checking environment file ==="
            if [ ! -f "apps/api/.env" ] && [ -n "${{ secrets.API_ENV_FILE }}" ]; then
              echo "${{ secrets.API_ENV_FILE }}" > apps/api/.env
            fi

            echo "=== Step 4: Building and running backend containers ==="
            docker compose -f docker-compose.prod.yml up -d --build api redis

            echo "=== Step 5: Pruning old unused Docker images ==="
            docker image prune -f

            echo "=== Step 6: Verifying backend health ==="
            for i in $(seq 1 12); do
              if curl -s -f http://localhost:5000/health/readiness > /dev/null; then
                echo "API is healthy and ready to serve traffic!"
                break
              fi
              echo "Waiting for API readiness ($i/12)..."
              sleep 5
            done

            echo "=== Deployment Completed Successfully! ==="
