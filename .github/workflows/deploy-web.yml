name: Deploy Frontend to Vercel

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'turbo.json'
      - '.github/workflows/deploy-web.yml'

jobs:
  validate-and-deploy:
    name: Validate & Deploy Web to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Web Lint & Typecheck
        run: |
          pnpm --filter web lint
          pnpm --filter web typecheck

      - name: Run Web Tests
        run: pnpm --filter web test

      - name: Deploy to Vercel
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: './apps/web'

      - name: Vercel Deployment Notice
        if: ${{ secrets.VERCEL_TOKEN == '' }}
        run: |
          echo "Notice: VERCEL_TOKEN secret is not configured in GitHub repository secrets."
          echo "Validation and tests passed successfully! If your GitHub repository is connected directly to Vercel, Vercel handles the deployment automatically."
