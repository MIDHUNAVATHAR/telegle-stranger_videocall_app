version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: donkey_play_mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: donkey_play
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: donkey_play_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local
