version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: donkey_play_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: donkey-play-api:latest
    container_name: donkey_play_api
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - '5000:5000'
    env_file:
      - apps/api/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s

volumes:
  redis_prod_data:
    driver: local
